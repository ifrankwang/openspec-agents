schema: spec-driven-standard

context: |
  项目技术背景、架构约定与工程规范以项目根目录 AGENTS.md 为准。
  本文件仅承载 OpenSpec 流程的通用规则；与项目相关的特化约束
  （技术栈、分层架构、数据库约定、质量门、方法论选择等）一律写入
  项目 AGENTS.md，生成与复核子代理会被指示读取它。
  explore 模式与 proposal 侧同源同严：凡涉及理清需求，必须按
  spec-driven-standard schema clarify 指令的决策树访谈方法论逐轮穷尽
  疑点；疑点未穷尽不得收束结论、不得捕获任何变更工件
  （proposal/specs/design/tasks），不得以「需求简单」等理由跳过。

rules:
  proposal:
    - "关联场景清点（强制）：proposal 动笔前必须完成「关联场景清点」并以代码检索为证据记入 clarify.md 的「关联场景清点（Related-Surface Survey）」小节：枚举本变更触及能力的全部消费方与关联面——功能入口（API 端点、导入/导出入口、定时任务、消息消费、前端调用等）、共享处理逻辑（被多个入口复用的处理链路）、数据模型与数据流下游（表/字段/事件/导出产物的读写双方），每条附代码位置证据（文件/类/方法）。凡共享处理逻辑发生变更，其全部消费入口必须在同一 change 内统一适配，禁止按入口分别提 change 导致共享逻辑两边割裂维护；确需拆分时必须在 proposal.md 单列「拆分边界」小节论证（每个 change 覆盖哪些入口、共享逻辑变更归属哪个 change、入口间契约），并经用户确认。proposal.md 必须单列「关联场景（Related Surface）」小节逐条列出清点结论与划界结论；泛写「无关联影响」而不附检索证据视为 proposal 未完成。"
    - "契约变更详列（强制）：凡变更涉及 DDL（建表/加列/索引/约束）或接口契约（新增/修改端点、请求响应结构、错误码），proposal.md 必须单列「契约变更点」小节逐条列出——DDL 逐表逐列给全表名、列名、类型、可空性、默认值与用途；API 逐端点给全方法+路径、请求/响应结构变化、新增/修改标记与兼容性影响。泛写「有契约变更」不逐条展开视为 proposal 未完成。"
    - "动笔前访谈门（强制）：proposal/specs/design/tasks 任一文档动笔前，必须已按 spec-driven-standard schema clarify 指令的决策树访谈方法论完成对用户的访谈——把方案建模为决策树逐轮穷尽疑点：每轮将前提已落定、当前可回答的问题一次性编号抛出并逐题附推荐答案，用户答复后重算下一轮前沿，直到决策树所有分支走完、无未决疑点、无静默假设；访谈问答全程记入 clarify.md（Open Questions / User Answers / 关联场景清点）。事实类问题必须自行查代码与 spec 求证，不抛给用户；疑点未穷尽时禁止写任何文档，不得以「需求简单」等理由跳过。"
    - "动笔前用户确认门（强制）：proposal/specs/design/tasks 任一文档动笔前，clarify.md 的 Architecture Direction 必须已记录用户对方案摘要的明确确认；确认必须以普通消息直接列出方案摘要要素点（要素清单见 spec-driven-standard schema clarify 指令的 Plan confirmation gate）并停下等待用户直接文字回复，禁止通过提问工具发起确认，提问工具的选项点击不视为确认；未记录时禁止写任何文档——主代理亲自写时先停下向用户补确认，生成子代理则立即终止并向编排方报告，不得以「需求简单」等理由跳过或代用户确认。"
  specs:
    - "数据行为需求（如\"系统 SHALL 持久化 X 含审计字段\"）放 spec；物理 DDL 放 design.md。"
    - "MODIFIED 的需求描述直接给出变更后的终态契约表述（\"系统 SHALL 使用 Y\"），供归档合并时原样落入主 spec；禁止以\"原 X 改为 Y\"的历史对比充当主 spec 内容。"
    - "同一语义只保留一条需求：修改已有需求用 MODIFIED，不得以新标题重复描述同一能力。"
  tasks:
    - "每个任务组必须以实质变更为主体（强制）：组内至少一个任务承载真实的代码/配置行为变更（实现 + 测试）；文档/脚本/部署文档同步、验证、回归、质量门只是随行工作，不构成组的实质内容。任务条数不等于实质——排到末位的剩余工作若只剩同步与验证，必须并入前一个功能组，禁止为其新开组（反例：「阶段二收尾：文档、脚本与全量验证」式收尾组）。"
    - "任务组覆盖关联入口（强制）：tasks.md 的任务组划分必须覆盖 proposal.md「关联场景」小节划入本 change 的全部消费入口；任一划入入口缺少对应适配任务视为 tasks 未完成。"
    - "真跨组依赖应拆为独立前置 change，在组标题下用 `> **前置 change：**` 标注，组间不可并行。"
    - "禁止人工门禁任务：不得生成\"等待用户确认/人工验收/人工回归后再继续\"式的任务或检查点；验证一律以自动化手段（编译、测试、质量门）闭环，确需人工执行的回归留档于 design.md 的 Risks/Migration，不进入 tasks.md。"
    - "禁止真实调用生产接口的任务：联调与验证只允许本地/测试环境（容器化测试、桩/mock 服务、本地 profile 的 API 测试），生产环境接口调用不得作为任务出现。"

operations:
  archive:
    guidance:
      - "归档前必须完成变更同步：delta 与主 spec 有差异时禁止直接归档。"
      - "归档同步无条件执行，无需用户确认：delta 与主 spec 存在差异时直接同步后归档，禁止提供\"不同步归档\"选项或就此询问用户；仅当同步失败或一致性校验无法收敛时停止并向用户报告。"
      - "主 spec 只描述当前契约：应用 MODIFIED 时把\"原 X 改为 Y\"式描述改写为终态表述，已废弃组件（表/类/接口/端点）不得保留在主 spec。"
      - "delta 出现移除/废弃/不再语义时，必须在主 spec 删除对应需求或场景，并在 delta spec 补写 `## REMOVED Requirements` 保持可追溯。"
      - "同一语义只保留一条需求：与已有需求重叠时合并，不得新增重复标题。"
      - "同步收敛：同步完成后主 spec 须完整反映 delta——ADDED 已存在、MODIFIED 为终态、REMOVED 已消失。"
      - "归档前运行 `openspec validate` 校验 MODIFIED 与主 spec 一致性，并核对主 spec 无变更式表述残留、无 REMOVED 残留、无重复需求、无空 spec 目录、无残留 TBD；未通过先修复。"
