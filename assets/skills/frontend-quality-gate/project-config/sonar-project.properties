# 项目根扫描配置。由编排初始化按模板创建；文件已存在时只补齐缺失键，不改动已有值。
# 认证：token 走 SONAR_TOKEN 环境变量（或 -Dsonar.token= 命令行参数），禁止写入本文件。
sonar.projectKey={{project.key}}
sonar.projectName={{project.name}}
sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=src,tests,e2e
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# 扫描排除项：依赖目录、构建产物、覆盖率产物与 e2e 报告不进扫描范围
sonar.exclusions=node_modules/**,dist/**,coverage/**,e2e/reports/**
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx,.vue
