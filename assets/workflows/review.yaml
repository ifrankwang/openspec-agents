# review workflow：独立审查会话（thorough 颗粒度，不绑定 OpenSpec change）
# 流转：三层审查（review 阶段 verify_tool → verify_task → verify_quality）+ in_progress 阶段 implement 修复闭环。
# fix=none（只审）会话的 fail 方向转移由引擎按 review_fix_policy 短路映射 done（implement 为拓扑统一声明的死 step）。
# 语义归属：step 级 instructions/constraints 定义各 step 专属语义；
# 跨所有 step 共享内容收敛到顶层 common（step 自动继承）；非 step 归属的引擎状态文案不进配置。
# 占位符 {{key}} 经 interpolateText 注入动态值，缺值保留原文。
# 无 change 语义：不引用 tasks.md/design.md/spec/openspec/changes；执行边界缺省整个 worktree。
id: review
name: Standalone Review Workflow (thorough)
max_retries: 10

# 跨所有 step 共享的通用指引/约束：渲染时 common 在前、step 在后合并进对应视图区块
common:
  instructions:
    - "非 OpenCode 直载形态（经 MCP 接入的 agent 客户端）调用 opx_* 工具时，须携带 `_agent` 参数并传自身角色名（如 openspec-developer）；缺省会被视为编排主代理视角，将拿不到自身角色的执行视图与操作指引"
    - "若当前工具列表中的编排工具带有 `mcp__<server>__` 前缀（MCP 接入形态，如 DeepSeek Harness / Claude Code / Codex / ZCode），调用时使用工具列表中的完整名称，例如 `mcp__opx__status`、`mcp__opx__agent_submit`；若工具列表中没有这些工具且存在 `dev_tool_search`，先用 `dev_tool_search` 搜索 `opx` 并一次性解锁全部需要的工具（含 `todo_write`）；禁止用 shell 查找 opx/openspec/MCP 配置"
    - "首次调用 opx_status 前不要探查仓库结构或状态文件；工具未解锁时只用 dev_tool_search 解锁，解锁后立即调用 opx_status"
    - "调用 opx_status 获取动态上下文（{{worktree_path}}、审查范围、上轮会话摘要）"
    - "按 Skill 加载清单加载匹配的 skill 并遵循其全部规范"
    - "阅读 `{{worktree_path}}/AGENTS.md` 项目规范"
    - "需要外部框架/工具的权威文档（规则语义、API 用法、配置说明）时，优先通过文档检索渠道获取，禁止直接翻源码"
    - "完成后调用 opx_agent_submit 提交裁决或失败上报"
  constraints:
    - "所有 edit/write 操作限定在 {{worktree_path}} 内，严禁修改主仓库路径下的文件"
    - "禁止为获取外部框架/工具的规则语义、API 用法等知识而解析其源码、jar 包或执行 AST dump；此类知识一律通过文档检索渠道获取；声明式规则定义来源（规则定义 XML 直拉、工具官方 Web API 返回、官方文档页）属于文档检索渠道范畴"
    - "不跳步骤、不自行推断阶段流转，next-step 以 opx_status 为准"
    - "禁止调用任何 opx_orch_* 工具（编排者专属）"
    - "审查/报告范围以视图「审查范围」区块为准：PR 区间形态为 base..head 区间 + 修复轮检查点增量；全量形态为整个代码库"

phases:
  - name: in_progress
    steps:
      - id: implement
        agents:
          - id: openspec-developer
            capability_tags: [efficiency, api-testing, quality-gate, dev-practices, db-design, style, architecture, performance, security, maintainability, cleanup]
        transitions:
          on_pass: verify_tool
          on_fail: implement
        instructions:
          - "以视图 Issue 清单驱动修复：Low+ 必办（修复后经 fixed_issue_ids 上报进入待复核），Info 建议修复不阻塞提交；不可修 issue 经 exempt_issue_ids 申请豁免（申请后进入待裁定状态，由报源 reviewer 裁定，被驳回的 issue 回待修复）；全部 blocking issue 均已上报修复或申请豁免后才可 passed 提交推进"
          - "执行边界缺省整个 worktree（独立审查无分析环节，不生成边界白名单）；issue 的 file 字段指向的文件即修复边界，修复这些文件（含回归引入问题）不算越界；可按 issue 的 suggestion 直接执行修复；reviewer 的 boundary_expansion 已并入边界"
          - "对修复未过次数≥2 的 issue 须先完成 5-Why 根因分析再动手，不得跳过分析直接改代码"
          - "修复完成后先 git commit 再提交；提交前按已加载的质量门类 skill 完成本地构建验证，并按维度规范类 skill（style/architecture/performance/security/maintainability 能力类别）对本次修复文件逐项自检，自检结论与工具检查结果一并汇总进 self_check_results"
          - "自证/验证需启动服务或基础设施时，一律按已加载技术栈 skill 的隔离启动规范以隔离方式启动，隔离标识与建议端口以视图 Worktree 区块为准；验证完成后停止本次启动的实例，不留残留；禁止为腾出端口或资源而停止、复用或干扰非本会话启动的进程"
          - "确定性质量工具检查出的问题不得以压制手段（压制注解/注释抑制/规则排除配置/平台状态标注/构建跳过开关等）静默规避：确需压制时，必须在压制处代码注释说明清楚理由，并经 exempt_issue_ids 申请豁免由报源 reviewer 裁定；不得以 fixed_issue_ids 冒充修复"
          - "提交 opx_agent_submit：必传 verdict；修复完成的 issue 经 fixed_issue_ids 上报、不可修 issue 经 exempt_issue_ids 申请豁免"
        constraints:
          - "本会话无任务清单门禁（无 tasks.md 子任务），修复范围仅由 issue 清单与检查结果界定"
          - "生产路径禁止 stub/fake/空实现/硬编码成功"
          - "提交前自检必须覆盖已加载的全部 skill（含维度规范类）检查点，不得以工具检查结果替代维度规范自检"
          - "禁止以压制手段静默规避确定性质量工具问题：压制必须附明确理由并经豁免申请流程裁定，不得以工具不再报错为由跳过申报"
  - name: review
    steps:
      - id: verify_tool
        agents:
          - id: openspec-reviewer-tool
            capability_tags: [quality-gate, efficiency, api-testing]
        transitions:
          on_pass: verify_task
          on_fail: implement
        instructions:
          - "依据 opx_status 提供的变更检测结果分流：无代码/配置变更且本层无待复核/待裁定项 → 直接提交 passed，不运行全量工具检查，并以一条 step 名首段为 no_change 的 validation_steps 声明本轮整体豁免必做清单（completed=false + 结构化 skip_reason 注明判定依据）；无变更但有本层待复核/待裁定项 → 仅复核/裁定待处理项后提交，不跑全量工具扫描；有变更 → 加载质量门类 skill 获取工具清单与映射规则，按已加载质量门 skill 必做清单逐项执行全部确定性工具检查（代码格式/架构约束/静态分析/单元测试编译/深度扫描——按必做清单中的对应项逐项执行并逐项申报），将工具输出映射为统一 issue 结构后提交"
          - "审查锚点按视图「审查范围」：PR 区间形态为 base..head 区间（首轮）或检查点增量（修复轮）；全量形态为整个代码库——全量形态下的工具违规无论是否本轮引入一律映射为 issue，不得以不在变更清单为由丢弃"
          - "「有变更」分支先审查上方「本次变更证据」区块的变更文件清单与区间 diff 内容后自行判断：若确认本次变更仅为注释/文档性且无逻辑影响，可自行决定跳过全量工具检查直接提交 passed（validation_steps 以 step=no_change 申报整体豁免必做清单）；无法确认或含逻辑/结构变更，必须顺序运行全部确定性工具检查；裁量仅免除全量工具扫描，不免除复核/裁定——本层 blocking issue 仍须处理至终态后提交"
          - "审查区间 diff 与 git log，识别变更中新增的压制手段（压制注解/注释抑制/规则排除配置/平台状态标注/构建跳过开关等）：视为豁免申请，核对是否已在压制处代码注释或 commit message 说明理由并申报豁免；未申报或理由不成立 → 报 issue（file=压制位置、line=压制行、rule=被压制规则名，severity 至少 Low）；理由成立 → 经 exempt_adjudications 裁定 dismissed"
          - "报 issue 时必须显式声明归因维度 dimension（style/architecture/performance/security/maintainability）：本 reviewer 不归属任一质量维度，dimension 即该 issue 归属的目标质量维度"
          - "复核本层已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定（dismissed/rejected）"
          - "提交 opx_agent_submit，必带 verdict 参数（passed / failed）"
          - "validation_steps 必须按已加载质量门 skill 必做清单逐项申报（completed=true 附执行结果；无法执行的必做项置 completed=false，并以结构化 skip_reason 申报降级理由，格式：{\"item\":\"<必做项>\",\"category\":\"<降级类别>\",\"adjudication\":\"user_response|unattended_auto|env_unavailable\",\"note\":\"<说明>\"}）；遗漏必做项或缺结构化降级理由的 passed 提交会被提交门禁拒绝"
          - "报静态分析类 issue 时，rule 字段必填官方规则全名（命名格式遵循已加载的质量门类 skill 的规则导航索引），漏填将导致项目级豁免清单无法生效"
          - "报静态分析类 issue 时，description 必须含：①复现命令（非静默形态，含必要开关）；②实测数据（命中类清单/计数）；③规则默认阈值与当前项目配置对比（引用可改的配置文件路径）"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit、question（需要用户协助处理时）；可 bash 运行工具；禁止 edit/write 影响代码运行的内容；文档/注释等不影响代码运行的内容发现不一致/过时问题时直接修正，不为此报 issue"
          - "即使无 issue 也必须提交 verdict=passed（不通过必须有至少一个 Low+ issue 作为理由）"
          - "Info 级 issue 的 description/suggestion 禁止阶段/时机表述（如'可后续处理'）"
          - "压制类 issue 严重级别至少 Low"
      - id: verify_task
        agents:
          - id: openspec-reviewer-task
            capability_tags: [api-testing, efficiency, dev-practices, cleanup]
        transitions:
          on_pass: verify_quality
          on_fail: implement
        instructions:
          - "回归验证层（独立审查场景，无 spec 验收标准——以既有测试与行为基线为锚）逐项验证：①构建通过；②既有测试全量执行不引入新失败——首轮跑出的存量失败按 issue 上报进入处置通道（审并修模式进修复闭环或豁免，只审模式进报告），修复轮出现「上轮未登记的新失败」即回归、verdict=failed 并报 issue（说明失败用例与归因）；③可启动服务时按已加载技术栈 skill 的隔离启动规范隔离启动做冒烟与既有 API 测试脚本执行（存在时），验证后幂等清理"
          - "验证完成后（含 verdict=failed 轮次）按已加载的清理规范执行幂等清理：停止残留的服务实例、清理本会话的隔离环境、删除残留的隔离扫描项目；无残留即通过，清理结果纳入 validation_steps 申报"
          - "无法启动服务或不存在 API 测试脚本时，③置 completed=false 并以结构化 skip_reason 申报（格式：{\"item\":\"<对应验证项>\",\"category\":\"<降级类别>\",\"adjudication\":\"user_response|unattended_auto|env_unavailable\",\"note\":\"<说明>\"}），注明判定依据"
          - "报 issue 时必须显式声明归因维度 dimension（style/architecture/performance/security/maintainability）：本 reviewer 不归属任一质量维度，dimension 即该 issue 归属的目标质量维度"
          - "复核本层已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定"
          - "按 opx_status 操作指引完成全部验证项，提交前将每项验证结果与证据填入 validation_steps 参数（未执行的项须填 skip_reason 注明原因），不得省略任何一项"
          - "提交 opx_agent_submit，必带 verdict"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit；可 bash 启动服务/执行检查；禁止 edit/write 影响代码运行的内容；文档/注释等不影响代码运行的内容发现不一致/过时问题时直接修正，不为此报 issue"
          - "即使无 issue 也必须提交 verdict=passed（不通过必须有至少一个 Low+ issue 作为理由）"
          - "禁止为腾出端口或资源而停止、复用或干扰非本会话启动的进程（含用户或其他会话运行的服务实例）；验证所需环境一律按隔离标识隔离启动"
      - id: verify_quality
        agents:
          - id: openspec-reviewer-style
            capability_tags: [style, efficiency, tool-improvement]
          - id: openspec-reviewer-architecture
            capability_tags: [architecture, efficiency, tool-improvement]
          - id: openspec-reviewer-performance
            capability_tags: [performance, efficiency, tool-improvement]
          - id: openspec-reviewer-security
            capability_tags: [security, efficiency, tool-improvement]
          - id: openspec-reviewer-maintainability
            capability_tags: [maintainability, efficiency, tool-improvement]
        transitions:
          on_pass: done
          on_fail: implement
        instructions:
          - "加载匹配维度 skill，审查锚点按视图「审查范围」（PR 区间形态为 base..head 区间 + 修复轮检查点增量，全量形态为整个代码库），结合 skill 规范与领域知识做拓展审查（skill 仅为最低基准）；顺带发现的其他缺陷按本维度严重级别标准报 issue，禁止静默丢弃"
          - "审查新 issue 前先查看视图「待复核」区块中的既有 issue（仅本维度报源），避免语义重复"
          - "报本维度新 issue 前先判断该问题能否通过调整确定性质量扫描工具配置（规则收紧/新增规则/配置增强）统一收敛：可工具化 → 双报业务 issue（file=违规现场）与工具改进 issue（file=规则/配置文件，suggestion 含规则草案+验证命令，末尾标 [tool_eligible]，且与业务 issue 同维度），两条 file 不同、方案不同，不构成语义重复，必须双报；不可工具化 → 仅报业务 issue。工具化判断细节与规则草案模板遵循已加载的工具改进类 skill，未加载时仅报业务 issue、跳过工具改进环节；提交时在 validation_steps 中记录工具化判断结论"
          - "复核自己报的本维度已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定（dismissed/rejected）"
          - "提交 opx_agent_submit，必带 verdict 与 validation_steps（验证步骤执行摘要）"
        constraints:
          - "禁止运行确定性工具检查（包括但不限于 linter/formatter/静态分析/编译/测试/架构约束检查等）；运行权归工具检查层，本约束不排斥基于已加载 skill 做工具化可行性判断并提交工具改进 issue"
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit；禁止 edit/write 影响代码运行的内容，仅输出审查报告；文档/注释等不影响代码运行的内容发现不一致/过时问题时直接修正，不为此报 issue"
          - "即使无 issue 也必须提交 verdict=passed；passed=false 时必须有至少一个归属本维度的 Low+ issue 作为理由"
