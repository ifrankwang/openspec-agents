# issue workflow：单条 issue 的独立流转
# 语义：triage（架构师裁定是否可修）→ fix（developer 实施修复）→
# verify_fix（reviewer 验证修复）→ 终态。相比 task workflow 以任务组为单元，
# issue workflow 以单条 issue 为单元，供 ADO/外部源收集器产出的 issue WorkItem 使用。
# 豁免语义：verify_fix 声明 reviewer_for: [openspec-developer]，dev 对 issue 申请的
# 豁免由该 review step 裁定（dismissed→cancelled、rejected→回 todo）。
id: issue
name: Issue Workflow
max_retries: 3
phases:
  - name: todo
    steps:
      - id: triage
        agents: [openspec-architect]
        capability_tags: [architecture, efficiency]
        transitions:
          on_pass: fix
          on_fail: triage
  - name: in_progress
    steps:
      - id: fix
        agents: [openspec-developer]
        capability_tags: [efficiency]
        transitions:
          on_pass: verify_fix
          on_fail: triage
  - name: review
    steps:
      - id: verify_fix
        agents: [openspec-reviewer-tool]
        capability_tags: [quality-gate, efficiency]
        reviewer_for: [openspec-developer]
        transitions:
          on_pass: done
          on_fail: fix
  - name: done
    steps:
      - id: terminal_done
        agents: [openspec-orchestrator]
        transitions:
          on_pass: done
          on_fail: done
  - name: cancelled
    steps:
      - id: terminal_cancelled
        agents: [openspec-orchestrator]
        transitions:
          on_pass: done
          on_fail: done
