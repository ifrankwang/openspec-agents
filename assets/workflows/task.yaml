# task workflow：OpenSpec change 的通用任务流转
# 对应现有编排阶段：实现（in_progress，首轮直接开发）→ 三重审查+收尾验证（review）；todo/analyze 仅作为 implement 上报 blocker 后的回退落点
# 语义归属：step 级 instructions/constraints 定义各 step 专属语义；
# 跨所有 step 共享内容收敛到顶层 common（step 自动继承）；非 step 归属的引擎状态文案不进配置。
# 占位符 {{key}} 经 interpolateText 注入动态值，缺值保留原文。
id: task
name: Task Workflow
max_retries: 10

# 跨所有 step 共享的通用指引/约束：渲染时 common 在前、step 在后合并进对应视图区块
common:
  instructions:
    - "非 OpenCode 直载形态（MCP 或原生工具接入的 agent 客户端）调用 opx_* 工具时，须携带 `_agent` 参数并传自身角色名（如 openspec-developer）；缺省会被视为编排主代理视角，将拿不到自身角色的执行视图与操作指引"
    - "调用编排工具一律使用工具列表中的实际名称：DSH 下为 `opx_*` 原生名（无 `mcp__` 前缀），MCP 接入形态（如 Claude Code / Codex / ZCode）为 `mcp__<server>__*`（如 `mcp__opx__status`、`mcp__opx__agent_submit`）；若工具列表中没有这些工具且存在 `dev_tool_search`，先用 `dev_tool_search` 搜索 `opx` 并一次性解锁全部需要的工具（含 `todo_write`）；禁止用 shell 查找 opx/openspec/MCP 配置"
    - "首次调用 opx_status 前不要探查仓库结构或状态文件；工具未解锁时只用 dev_tool_search 解锁，解锁后立即调用 opx_status"
    - "调用 opx_status 获取动态上下文（{{worktree_path}}、变更范围、上轮会话摘要）"
    - "按 Skill 加载清单逐项加载列出的 skill（不可跳步）并遵循其全部规范"
    - "逐项检视所有已加载 skill 的全部规范条目并确认满足（不满足则补做，不得跳过）；对维度规范类 skill 逐章节核对审查范围内代码"
    - "读取 `{{worktree_path}}/openspec/changes/{{change_id}}/` 下的相关文档：tasks.md（任务清单，按行内 `[spec:xxx]` 溯源定位 specs/ 下相关 spec.md）、design.md、proposal.md"
    - "阅读 `{{worktree_path}}/AGENTS.md` 项目规范"
    - "需要外部框架/工具的权威文档（规则语义、API 用法、配置说明）时，优先通过文档检索渠道获取，禁止直接翻源码"
    - "完成后调用 opx_agent_submit 提交裁决或失败上报"
  constraints:
    - "所有 edit/write 操作限定在 {{worktree_path}} 内，严禁修改主仓库路径下的文件"
    - "禁止为获取外部框架/工具的规则语义、API 用法等知识而解析其源码、jar 包或执行 AST dump；此类知识一律通过文档检索渠道获取；声明式规则定义来源（规则定义 XML 直拉、工具官方 Web API 返回、官方文档页）属于文档检索渠道范畴"
    - "不跳步骤、不自行推断阶段流转，next-step 以 opx_status 为准"
    - "禁止调用任何 opx_orch_* 工具（编排者专属）"
    - "以视图「变更范围」命令产出的文件清单作为本次实施/修改范围；审查/报告范围按各 step 指令执行"

phases:
  - name: todo
    steps:
      - id: analyze
        agents:
          - id: openspec-architect
            capability_tags: [architecture, api-design, db-design]
        must_do:
          always: []
        transitions:
          on_pass: implement
          on_fail: analyze
        instructions:
          - "处理 implement 上报的 blocker：逐条核对 category / description / evidence，判断属于用户确认型、方案/设计缺口型还是环境/技术阻塞型"
          - "处理 blocker 过程中如发现新的方案/设计缺口，可按 blockers 参数提交（category: architecture_design 或 info_gap），并在裁决结论中说明需回提案流程修订的范围"
          - "需用户拍板的问题由你直接确认：有人值守时用 question 工具向用户提问（拿到答复当场继续）；无人值守时（依据视图「确认模式」标识）自行选择最优解继续；确认/裁决后当场继续执行"
          - "经 blocker_updates 逐条置 resolved（user_response 填确认/裁决结论与处理方式）；存在未解决 blocker 时无法以 passed 提交"
          - "blocker 属方案/设计缺口时，判断是否需回提案流程修订规划文档：需要时在裁决结论中明确要求，不得在本步骤重写 design.md / proposal.md / specs（规划文档修改归提案流程）"
          - "需要调整实施范围时修订执行边界：经 execution_boundary 提交（仅在需要变更时提交，未变更不提交）"
          - "本步骤不做文档一致性复核与架构模式审查（已前移到提案阶段架构审查）"
          - "提交 opx_agent_submit"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit、question（需用户拍板时使用）"
          - "只处理当前任务组的 blocker 与执行边界修订，不做全量文档复核"
  - name: in_progress
    steps:
      - id: implement
        agents:
          - id: openspec-developer
            capability_tags: [api-testing, e2e-testing, test-design, quality-gate, dev-practices, db-design, style, architecture, performance, security, maintainability, cleanup]
        must_do:
          always:
            - compile
            - format
            - architecture
            - static_analysis
            - unit_test
            - coverage
            - behavior_surface
            - case_matrix
          backend:
            - api_script
            - api_execution
            - chain_map
          frontend:
            - e2e_script
            - e2e_run
        transitions:
          on_pass: verify_tool
          on_fail: analyze
        instructions:
          - "tasks.md 当前任务组任务项 + `[spec:xxx]` 溯源 specs/ 下相关 spec.md（需求细节与验收标准）；存在时读取 clarify.md（架构方向结论）；执行边界以视图为准（来源 clarify.md，未解析到时默认整个 worktree）"
          - "按 Task 项顺序逐个实现，聚焦当前子任务，不超出执行边界"
          - "实施前识别 spec 描述的一并操作行为组（如状态变更与数据入队这类需同时发生的多个行为）；实施后逐项自证每个行为真实生效，禁止以单一状态字段的实现替代其他行为"
          - "涉及数据模型或流程产出变更（含字段/实体承载位置搬迁、AI 生成等流程产物）时，自证须包含关键数据产出断言：产出字段已持久化到 spec 指定承载位置且值完整非空、搬迁承接与同一输入产出基线一致（按已加载接口测试规范执行）；禁止仅以流程跑通/接口成功替代"
          - "自证/验证需启动服务或基础设施时，一律按已加载技术栈 skill 的隔离启动规范以隔离方式启动，隔离标识与建议端口以视图 Worktree 区块为准；隔离对象不限于数据库——为本变更启动的 mock 服务、消息队列/缓存等中间件、扫描分析平台等一切环境资源均须按隔离标识隔离，禁止复用既有实例或共享端口；启动前发现隔离环境有残留时，先按已加载的清理规范幂等清空再启动；残留判定遵循已加载清理规范的归属判别，无法确认归属本变更的进程一律不清"
          - "涉及接口契约或数据口径变更（按已加载的测试规范判定）时，实施过程中即时更新/新建与本次 change 的业务链路清单对应的接口测试脚本（按链路组织 .http 文件与 ### 块，已有脚本更新为匹配变更后契约，尚无脚本则新建，并同步 SQL 前置数据脚本），按已加载测试规范的完整执行顺序（含 SQL 前置数据准备、隔离启动基础设施与服务、执行接口测试脚本）执行接口测试，确保变更内容真实有效；执行结果经 must_do_checks 的 api_execution 项申报（附执行顺序、覆盖链路清单与接口清单）；修复被驳回 issue 后再次提交前同样须执行"
          - "牵动数据的其它写入路径存在时（同一份数据被导入、保存、更新、批量同步等多条路径写入），实施后按已加载测试设计规范自证跨路径顺序作用：后一条路径执行后回查持久化状态，逐字段核对默认值/派生值是被重算、重置还是保留，与 spec 语义一致"
          - "自证完成后停止本次启动的服务/基础设施实例，不留残留"
          - "环境/基础设施问题（schema 缺失、DDL 未执行、依赖未安装）应通过 migration/初始化脚本等代码层面解决；仅生产级凭据、真实第三方资源、人工运维才走 blocker/豁免"
          - "issue 指向文件的目录已并入执行边界，修复这些文件（含回归引入问题）不算越界；issue 的 file 字段指向 openspec/changes/ 下文档时，按该 issue 要求修复对应文档同样不算越界（仅限该 issue 指定文件，不得扩大范围）；可按 issue 的 suggestion 直接执行修复；reviewer 的 boundary_expansion 已并入边界"
          - "按视图 Issue 清单分类实施：Low+ 必办，Info 建议修复不阻塞提交"
          - "对修复未过次数≥2 的 issue 须先完成 5-Why 根因分析再动手，不得跳过分析直接改代码"
          - "全部实现完成后先 git commit 再提交（未提交内容会被工具拒绝）"
          - "提交前按已加载的质量门类 skill 完成本地构建验证并核对覆盖率门禁达标后再提交"
          - "提交前完成自检，自检结论并入 must_do_checks 逐项证据"
          - "提交前按已加载的维度规范类 skill（style/architecture/performance/security/maintainability 能力类别）对本次变更文件逐项自检（聚焦本轮变更文件，不扩散全量代码），自检结论并入 must_do_checks 逐项 evidence；修复被驳回 issue 后再次提交前同样须按维度规范类 skill 对变更文件自检后再提交"
          - "自检须覆盖已加载的维度规范类 skill 的全部检查点，must_do_checks 按维度逐项列结论（通过/遗留及理由），禁止仅汇总工具检查结果"
          - "实施产出的部署注意点（数据/结构变更脚本执行、消息队列/缓存等中间件配置调整、新增配置项或功能开关、外部接口契约变化、依赖清单/构建配置变更（合并后需在主仓库重装依赖、重新构建））凡属规划文档（design.md/tasks.md/proposal.md/specs/）未记载的，随提交经 deployment_notes 参数逐条申报（每条一个注意点）；规划文档已记载的不重复申报；修复轮重新提交时保留既有部署注意点"
          - "修复完成的 issue 经 fixed_issue_ids 上报后进入待复核（review）状态，终态由报源 reviewer 复核裁定；不可修 issue 经 exempt_issue_ids 申请豁免（申请后进入待裁定（review）状态，由报源 reviewer 在后续审查轮次裁定，被驳回的 issue 回待修复）；Info 级 issue 不阻塞提交，无需申请豁免；全部 blocking issue 均已上报修复或申请豁免后才可 passed 提交推进"
          - "确定性质量工具检查出的问题不得以压制手段（压制注解/注释抑制/规则排除配置/平台状态标注/构建跳过开关等）静默规避：确需压制时，必须在压制处代码注释说明清楚理由（commit message 可补充），并经 exempt_issue_ids 申请豁免由报源 reviewer 裁定；不得以 fixed_issue_ids 冒充修复；被驳回后须移除压制并真实修复"
          - "遇外部依赖、凭证、真实输入或必须 stub/降级/跳过验收才能继续时，以 verdict=failed 提交 blocker（含 source_role、task_id、category、description、evidence、attempted_actions、options）"
          - "blocker 上报后：有人值守经 question 向用户确认处理方式；无人值守按视图「确认模式」标识自行裁决。blocker 的 resolved 由架构裁决者在 analyze 回退步骤处理，你无需自行 resolve；人工执行任务凭视图 Blocker 留痕（resolved 且 user_response 记录确认/裁决结论）列入 completed_task_ids 重新提交（申报依据为 blocker 记录，不得凭空申报）"
          - "提交 opx_agent_submit：passed 提交前须将全部已完成（含被驳回后修复的）子任务列入 completed_task_ids（数字 id 如 1、2，或任务编号如 1.1）申报，全部子任务已验证时可省略；无法完成或人工执行的任务不得虚报，应经 verdict=failed + blocker 上报后凭留痕申报；不可修 issue 申请豁免（exempt_issue_ids）"
        constraints:
          - "禁用 edit/write 修改 `{{worktree_path}}/openspec/changes/` 下任何文档（spec/design/tasks/clarify）；唯一例外：所提交 fixed_issue_ids 中某 issue 的 file 字段指向该目录下文档时，仅允许按该 issue 的要求修改对应文档，不得扩大范围；本约束为提示词级约束，工具层不校验实际改动的文件"
          - "允许变更目录范围：{{allowed_directories}}"
          - "允许引用包范围：{{allowed_packages}}"
          - "实施前请注意遵守：{{notes}}"
          - "生产路径禁止 stub/fake/空实现/硬编码成功"
          - "提交前自检必须覆盖已加载的全部 skill（含维度规范类）检查点，不得以工具检查结果替代维度规范自检"
          - "需以 verdict=failed + blocker 上报的条件：需求模糊 / design 问题 / 技术阻塞 / 超出执行边界"
          - "禁止以质量扫描平台状态修改（SAFE/WONTFIX/False Positive/Confirmed 等）作为豁免手段：平台状态仅作用于当前质量扫描平台项目实例，每次 change 使用独立项目 key，不跨 change 生效；存量问题跨 change 豁免必须经 exempt_issue_ids 申请 → 报源 reviewer 裁定 dismissed 的流程"
          - "禁止以压制手段静默规避确定性质量工具问题：压制必须附明确理由并经豁免申请流程裁定，不得以工具不再报错为由跳过申报"
          - "禁止为腾出端口或资源而停止、复用或干扰非本变更启动的进程（含用户或其他会话运行的服务实例）；验证所需环境（数据库、mock 服务、消息队列/缓存等中间件、扫描分析平台等）一律按隔离标识隔离启动，禁止共享或占用宿主既有实例"
  - name: review
    steps:
      - id: verify_tool
        agents:
          - id: openspec-reviewer-tool
            capability_tags: [quality-gate]
        must_do:
          always:
            - env
            - compile
            - format
            - architecture
            - static_analysis
            - unit_test
            - coverage
            - deep_scan
            - config_check
        transitions:
          on_pass: verify_task
          on_fail: implement
        instructions:
          - "依据 opx_status 提供的变更检测结果分流：无代码/配置变更且本层无待复核/待裁定项 → 直接提交 passed，不运行全量工具检查，并以一条 step 名首段为 no_change 的 must_do_checks 申报本轮整体豁免必做清单（completed=false + 结构化 skip_reason 注明判定依据）；无变更但有本层待复核/待裁定项 → 仅复核/裁定待处理项后提交，不跑全量工具扫描；有变更 → 加载质量门类 skill 获取工具清单与映射规则，按视图「本 step 必做清单」逐项执行全部确定性工具检查（代码格式/架构约束/静态分析/单元测试编译/深度扫描——按必做清单中的对应项逐项执行并逐项申报），将工具输出映射为统一 issue 结构后提交"
          - "「有变更」分支先审查上方「本次变更证据」区块的变更文件清单与区间 diff 内容后自行判断：若确认本次变更仅为注释/文档性且无逻辑影响（非注释掉代码、非结构性/格式化变更、非文件重命名），可自行决定跳过全量工具检查直接提交 passed（must_do_checks 以 step=no_change 申报整体豁免必做清单）；无法确认或含逻辑/结构变更，必须顺序运行全部确定性工具检查；裁量仅免除全量工具扫描，不免除复核/裁定——本层 blocking issue 仍须处理至终态后提交"
          - "分级复验：低成本必做项（env/compile/format/architecture/static_analysis/unit_test/config_check 等分钟级项）全量实跑并逐项申报（completed=true 附执行结果）；deep_scan 按核验申报口径处理——以视图「本 step 必做清单」与上方「本次变更证据」区块（变更文件清单 + 区间 diff）为核对对象，核对深度扫描证据完整性与命中项对变更内容的合理性，并抽验命中项（如本地复跑单规则静态分析验证命中真实存在），不重扫全量；申报形态为 step 名首段 deep_scan、completed=true、evidence 注明核验方式与抽验样本。白名单口径：仅高成本必做项（deep_scan）允许核验申报形态，其余必做项必须实跑后申报。升级回退全量重跑触发条件（统一三处）：深度扫描证据缺失或不完整 / 抽验失败 / 本轮为修复轮且修复波及接口契约或数据口径——命中任一即本轮 deep_scan 改为实跑全量"
          - "审查「本次变更证据」的区间 diff 与 git log，识别变更中新增的压制手段（压制注解/注释抑制/规则排除配置/平台状态标注/构建跳过开关等）：视为豁免申请，核对 dev 是否已在压制处代码注释或 commit message 说明理由并申报豁免；未申报或理由不成立 → 报 issue（file=压制位置、line=压制行、rule=被压制规则名，severity 至少 Low，description/suggestion 写明判定门槛与理由），要求移除压制真实修复或补申报；理由成立 → 经 exempt_adjudications 裁定 dismissed"
          - "报 issue 时必须显式声明归因维度 dimension（style/architecture/performance/security/maintainability）：本 reviewer 不归属任一质量维度，dimension 即该 issue 归属的目标质量维度"
          - "当发现修复需要调整 openspec/changes/ 下文档时，所报 issue 的 file 字段必须指向目标文档"
          - "复核本层已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定（dismissed/rejected）"
          - "提交 opx_agent_submit，必带 verdict 参数（passed / failed）"
          - "报静态分析类 issue 时，rule 字段必填官方规则全名（命名格式遵循已加载的质量门类 skill 的规则导航索引），漏填将导致项目级豁免清单无法生效"
          - "报静态分析类 issue 时，description 必须含：①复现命令（非静默形态，含必要开关）；②实测数据（命中类清单/计数）；③规则默认阈值与当前项目配置对比（引用可改的配置文件路径）"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit、question（需要用户协助处理时）；可 bash 运行工具；禁止 edit/write 影响代码运行的内容；文档/注释等不影响代码运行的内容发现不一致/过时问题时直接修正，不为此报 issue"
          - "提交前工作区不得残留代码类未提交改动（反向探针改动必须还原、新增临时文件必须删除；不得以 commit 方式提交这类改动绕过检查）；仅注释修正与文档类可提交——源码内注释修正的 commit 必须只含注释改动、不得夹带逻辑改动，文档类改动（openspec/ 下文件与 .md 文件，含新建的未跟踪文件）会在提交时自动 commit，不受此限。工具层会拒绝带代码类未提交改动的提交"
          - "即使无 issue 也必须提交 verdict=passed（不通过必须有至少一个 Low+ issue 作为理由）"
          - "Info 级 issue 的 description/suggestion 禁止阶段/时机表述（如'可后续处理'）"
          - "禁止以质量扫描平台状态修改（SAFE/WONTFIX/False Positive/Confirmed 等）作为豁免手段：平台状态仅作用于当前质量扫描平台项目实例，每次 change 使用独立项目 key，不跨 change 生效；存量问题跨 change 豁免必须经 exempt_issue_ids 申请 → 报源 reviewer 裁定 dismissed 的流程"
          - "压制类 issue 严重级别至少 Low"
          - "有实质变更时，工具检查及 issue 报告覆盖全量代码；非本轮变更文件的工具违规同样必须映射为 issue（命中项目级豁免清单的按 Info，不重新豁免；其余非本轮引入问题按原严重级别上报），不得以不在变更清单或未越界修改为由丢弃"
      - id: verify_task
        agents:
          - id: openspec-reviewer-task
            capability_tags: [api-testing, e2e-testing, test-design, dev-practices, cleanup]
        must_do:
          always:
            - behavior_surface
            - case_matrix
            - negative_probe
          backend:
            - api_script
            - api_execution
            - chain_map
          frontend:
            - e2e_script
            - e2e_run
        transitions:
          on_pass: verify_quality
          on_fail: implement
        instructions:
          - "逐项验证：①task 产出完整性 ②启动服务并检查健康 ③按 change 业务链路清单逐条执行测试并核验（接口测试或端到端测试，按会话技术栈对应；每条链路由真实入口起步、按业务顺序串联、末端断言后续查询字段内容与写入值逐字段一致，链路为空集时核验其声明依据）并审查质量（测试数据贴近业务语义，禁止无意义占位值） ④审查测试代码质量（断言放水/Mock 过度/覆盖不足）⑤业务行为真实性：对照 spec 逐项核验每个业务行为的实现与断言证据（含一并操作的行为组、连带效果、下游消费），核验链路的字段级断言强度与链路清单覆盖完整性，识别『仅打状态标记未实际生效』类缺陷 ⑥关键数据产出核验：对照 spec 数据产出要求，核验实现与测试是否覆盖产出数据落位（spec 指定承载位置）、完整非空、搬迁承接与同一输入基线一致，识别『流程正常但数据缺失/落错位置』类缺陷 ⑦跨写路径顺序作用核验：同一份数据存在多条写入路径时，核验后一条路径执行后默认值/派生值的重算或重置语义与 spec 一致，并核验缺陷触发顺序（前置状态 + 操作顺序）已固化为回归场景"
          # 全模式 verify_task 视图不渲染开发者必做项申报，故证据源取变更 diff 与 worktree 测试代码；两种模式均由审查者独立推导，不以开发者申报为输入
          - "测试设计核验（独立完成，不以 dev 申报为输入）：从 spec、proposal 的关联场景与既有实现独立推导行为面清单、用例矩阵与业务链路清单，核对测试对行为面与链路的覆盖、断言强度与实施正确性；自行对关键用例执行反向探针——改坏被测实现 → 确认对应用例变红 → 原样还原实现 → 全量用例复跑全绿，把改坏点与还原确认结果编入 must_do_checks 的 negative_probe 申报；用例未变红视为该用例无对抗力，须报 issue；无测试对象（无代码、接口契约与数据口径变更）时以 completed=false + 结构化 skip_reason 申报；不得跳过核验直接提交通过"
          - "本 step 能力集含测试类能力，须按已加载测试规范申报对应必做项（接口测试为 api_script/api_execution，端到端测试为 e2e_script/e2e_run）：脚本类必做项对应「变更涉及的行为有对应测试脚本」，执行类必做项对应「按已加载测试规范执行脚本实跑」；变更不涉及对应行为（接口契约、数据口径或端到端行为）时，对应两项均置 completed=false，category 填 not_applicable、adjudication 按实际裁定方式填，note 写判定依据；变更涉及对应行为但隔离环境不可用（服务无法启动、隔离实例不可用）时，仅执行类必做项置 completed=false，category 与 adjudication 均填 env_unavailable，note 记录尝试过程，脚本类必做项仍须实查脚本存在性，脚本缺失按「变更行为无对应脚本」判例报 issue，不得以环境不可用为由跳过；多类测试语义分开，不得混用"
          - "验证完成后（含 verdict=failed 轮次）按已加载的清理规范执行幂等清理：停止残留的服务实例、清理本 change 的隔离环境、删除残留的隔离扫描项目；无残留即通过，清理结果纳入 must_do_checks 申报"
          - "本次变更仅含测试代码（判定：视图「变更范围」文件清单全部命中已加载技术栈 skill 定义的测试代码路径，且无生产代码、接口契约、构建与测试配置等非测试文件）时，豁免②启动服务并检查健康与③按业务链路清单执行测试，仅验证①④；豁免时 must_do_checks 中②③置 completed=false，并以结构化 skip_reason 申报（格式：{\"item\":\"<对应验证项>\",\"category\":\"<降级类别>\",\"adjudication\":\"user_response|unattended_auto|env_unavailable\",\"note\":\"<说明>\"}），note 注明「本次变更仅含测试代码，豁免启动服务与测试执行」及判定依据；⑤⑥⑦的实现核验在纯测试代码变更场景无对象，其断言证据核验并入④测试代码质量"
          - "读取 design.md 的 API 定义（请求/响应结构、数据模型）与 specs/ 下相关 spec.md（需求细节、验收标准与数据产出要求），用于准备测试数据与对照 API 合约"
          - "有 task 未通过时必须 verdict=failed 并经 failed_tasks 上报（task_id + reason）；passed 时不允许提供 failed_tasks"
          - "对标注人工执行/环境不可验证的任务，核验视图 Blocker 留痕区块（resolved 且 user_response 记录用户确认）后经 verified_tasks 确认并在 must_do_checks 留痕；无留痕且无法自行验证 → verdict=failed 经 failed_tasks 驳回并说明理由"
          - "当发现修复需要调整 openspec/changes/ 下文档时，所报 issue 的 file 字段必须指向目标文档"
          - "报 issue 时必须显式声明归因维度 dimension（style/architecture/performance/security/maintainability）：本 reviewer 不归属任一质量维度，dimension 即该 issue 归属的目标质量维度"
          - "复核本层已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定"
          - "按 opx_status 操作指引完成全部验证项，提交前将每项必做的验证结果与证据填入 must_do_checks 参数（未执行的项须填结构化 skip_reason 注明原因），不得省略任何一项"
          - "提交 opx_agent_submit，必带 verdict 与 verified_tasks（覆盖全部待验证 task）"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit；可 bash 启动服务/执行检查；禁止 edit/write 影响代码运行的内容；文档/注释等不影响代码运行的内容发现不一致/过时问题时直接修正，不为此报 issue"
          - "反向探针例外：执行反向探针核验时可临时改坏被测实现（仅限探针所需的最小改动），探针结束后必须原样还原并确认 git 工作区无残留改动（git status 无改动）、全量用例复跑全绿；探针内容禁止提交，不得保留任何痕迹；用例未变红视为该用例无对抗力，须报 issue"
          - "提交前工作区不得残留代码类未提交改动（反向探针改动必须还原、新增临时文件必须删除；不得以 commit 方式提交这类改动绕过检查）；仅注释修正与文档类可提交——源码内注释修正的 commit 必须只含注释改动、不得夹带逻辑改动，文档类改动（openspec/ 下文件与 .md 文件，含新建的未跟踪文件）会在提交时自动 commit，不受此限。工具层会拒绝带代码类未提交改动的提交"
          - "即使无 issue / 无待验证 task 也必须提交 verdict=passed（不通过必须有至少一个 Low+ issue 作为理由）"
      - id: verify_quality
        agents:
          - id: openspec-reviewer-style
            capability_tags: [style, tool-improvement]
          - id: openspec-reviewer-architecture
            capability_tags: [architecture, tool-improvement]
          - id: openspec-reviewer-performance
            capability_tags: [performance, tool-improvement]
          - id: openspec-reviewer-security
            capability_tags: [security, tool-improvement]
          - id: openspec-reviewer-maintainability
            capability_tags: [maintainability, tool-improvement]
        must_do:
          always:
            - dimension_skill_review
        transitions:
          on_pass: verify_cleanup
          on_fail: implement
        instructions:
          - "加载匹配维度 skill，以本轮 diff/变更文件为锚点结合 skill 规范与领域知识做拓展审查（skill 仅为最低基准）；顺带发现的非本轮缺陷按本维度严重级别标准报 issue，禁止静默丢弃"
          - "维度规范逐 skill 核对的锚点为变更范围（本轮 diff/变更文件及既有代码中该 skill 规范对应的违规面），复核轮不因聚焦收敛而豁免逐 skill 核对申报；dimension_skill_review 申报不受 no_change 整体豁免覆盖"
          - "审查新 issue 前先查看视图「待复核」区块中的既有 issue（仅本维度报源），避免语义重复"
          - "当发现修复需要调整 openspec/changes/ 下文档时，所报 issue 的 file 字段必须指向目标文档"
          - "报本维度新 issue 前先判断该问题能否通过调整确定性质量扫描工具配置（规则收紧/新增规则/配置增强）统一收敛：可工具化 → 双报业务 issue（file=违规现场）与工具改进 issue（file=规则/配置文件，suggestion 含规则草案+验证命令，末尾标 [tool_eligible]，且与业务 issue 同维度），两条 file 不同、方案不同，不构成语义重复，必须双报；工具改进 issue 目标文件在执行边界外时附 boundary_expansion（仅 verdict=failed 时可附）；不可工具化 → 仅报业务 issue。工具化判断细节与规则草案模板遵循已加载的工具改进类 skill，未加载工具改进类 skill 时仅报业务 issue、跳过工具改进环节；提交时在 must_do_checks 中记录工具化判断结论"
          - "复核自己报的本维度已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定（dismissed/rejected）"
          - "提交 opx_agent_submit，必带 verdict 与 must_do_checks（本 step 必做项申报）"
        constraints:
          - "禁止运行确定性工具检查（包括但不限于 linter/formatter/静态分析/编译/测试/架构约束检查等）；运行权归 tool review 层，本约束不排斥基于已加载 skill 做工具化可行性判断并提交工具改进 issue"
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit；禁止 edit/write 影响代码运行的内容，仅输出审查报告；文档/注释等不影响代码运行的内容发现不一致/过时问题时直接修正，不为此报 issue"
          - "提交前工作区不得残留代码类未提交改动（反向探针改动必须还原、新增临时文件必须删除；不得以 commit 方式提交这类改动绕过检查）；仅注释修正与文档类可提交——源码内注释修正的 commit 必须只含注释改动、不得夹带逻辑改动，文档类改动（openspec/ 下文件与 .md 文件，含新建的未跟踪文件）会在提交时自动 commit，不受此限。工具层会拒绝带代码类未提交改动的提交"
          - "即使无 issue 也必须提交 verdict=passed；passed=false 时必须有至少一个归属本维度的 Low+ issue 作为理由"
      - id: verify_cleanup
        agents:
          - id: openspec-developer
            capability_tags: [cleanup, api-testing, e2e-testing, dev-practices]
        must_do:
          always: []
          backend:
            - api_script
            - api_execution
            - chain_map
          frontend:
            - e2e_script
            - e2e_run
        transitions:
          on_pass: done
          on_fail: verify_cleanup
        instructions:
          - "将基准分支（{{base_branch}}）最新代码合并进当前工作分支（git merge 基准分支），解决合并冲突；修复范围仅限合并冲突涉及文件与回归失败定位文件（改动仅用于解决合并引入的问题，可超出现有执行边界，禁止借机扩大范围）"
          - "合并后回归复验：按已加载的开发实践规范执行构建验证；按已加载测试规范执行全量测试（含接口测试与端到端测试，按会话技术栈对应；接口测试按 change 业务链路清单复跑、端到端测试按链路场景复跑，含字段级断言、关键数据产出/搬迁回归与跨写路径顺序作用回归断言）；全部通过才算通过，不分失败来源（含基准分支新代码引入的失败）"
          - "本 step 能力集含测试类能力，须按已加载测试规范申报对应必做项（接口测试为 api_script/api_execution，端到端测试为 e2e_script/e2e_run）：脚本类必做项对应「变更涉及的行为有对应测试脚本」，执行类必做项对应「按已加载测试规范执行脚本实跑」；变更不涉及对应行为（接口契约、数据口径或端到端行为）时，对应两项均置 completed=false，category 填 not_applicable、adjudication 按实际裁定方式填，note 写判定依据；变更涉及对应行为但隔离环境不可用（服务无法启动、隔离实例不可用）时，仅执行类必做项置 completed=false，category 与 adjudication 均填 env_unavailable，note 记录尝试过程，脚本类必做项仍须实查脚本存在性，脚本缺失按「变更行为无对应脚本」判例报 issue，不得以环境不可用为由跳过；多类测试语义分开，不得混用"
          - "按已加载的清理规范执行幂等清理：停止残留的服务实例、清理本 change 的隔离环境、删除残留的扫描分析项目；无对应 skill 规范时跳过并在申报中注明"
          - "清理后确认工作分支 git status 干净（含未跟踪文件）"
          - "自报 issue 必须在本 step 内收敛至终态（修复后自行复核通过，或申请豁免后自行裁定）后再提交；报 issue 时显式声明归因维度 dimension（该维度仅作归因标签，不代表对应维度 reviewer 会复核此 issue）"
          - "存在无法解决的残留或回归失败 → verdict=failed 并报 Low+ issue（显式声明归因维度 dimension）"
          - "完成后调用 opx_agent_submit 提交裁决"
          - "收口时工具会自动对 change 执行 openspec archive 归档并提交，无需手动归档；归档失败收口会回退到本 step，按 blocked 指引处理残留后重新提交收尾验证"
        constraints:
          - "可 bash 执行构建/测试/清理命令；禁止 edit/write 任何 {{worktree_path}} 之外的文件"
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit、question"
          - "禁止提报与收尾验证无关的 issue"
