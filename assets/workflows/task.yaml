# task workflow：OpenSpec change 的通用任务流转
# 对应现有编排阶段：分析（todo）→ 实现（in_progress）→ 三重审查（review）
# 语义归属：step 级 instructions/constraints 定义各 step 专属语义；
# 跨所有 step 共享内容收敛到顶层 common（step 自动继承）；非 step 归属的引擎状态文案不进配置。
# 占位符 {{key}} 经 interpolateText 注入动态值，缺值保留原文。
id: task
name: Task Workflow
max_retries: 5

# 跨所有 step 共享的通用指引/约束：渲染时 common 在前、step 在后合并进对应视图区块
common:
  instructions:
    - "调用 opx_status 获取动态上下文（{{worktree_path}}、变更范围、上轮会话摘要）"
    - "按 Skill 加载清单加载匹配的 skill 并遵循其全部规范"
    - "读取 `{{worktree_path}}/openspec/changes/{{change_id}}/` 下的相关文档：tasks.md（任务清单，按行内 `[spec:xxx]` 溯源定位 specs/ 下相关 spec.md）、design.md、proposal.md"
    - "阅读 `{{worktree_path}}/AGENTS.md` 项目规范"
    - "完成后调用 opx_agent_submit 提交裁决或失败上报"
  constraints:
    - "所有 edit/write 操作限定在 {{worktree_path}} 内，严禁修改主仓库路径下的文件"
    - "不跳步骤、不自行推断阶段流转，next-step 以 opx_status 为准"
    - "禁止调用任何 opx_orch_* 工具（编排者专属）"
    - "以视图「变更范围」命令产出的文件清单作为本次工作范围"

phases:
  - name: todo
    steps:
      - id: analyze
        agents:
          - id: openspec-architect
            capability_tags: [architecture, api-design, db-design, efficiency]
        transitions:
          on_pass: implement
          on_fail: analyze
        instructions:
          - "design.md 全文逐维校验一致性（据 tasks.md 各行 `[spec:xxx]` 溯源定位 specs/ 下相关 spec.md 一并复核）"
          - "对视图列出的各评估维度逐项审查并给出结论（无问题也需简要确认），不以假设替代确认"
          - "校验设计文档与任务前提的一致性，评估架构模式合规性"
          - "输出执行边界：allowed_directories（含测试目录）与 allowed_packages 白名单，notes 仅填实施建议（关键坑位/组件复用/边缘场景/框架应用/通用做法），不重复目录与包路径，无补充时留空"
          - "存在缺口时提交 blocker（category: architecture_design / info_gap），不以假设替代确认"
          - "需用户确认时正常模式先 question 工具向用户确认，无人值守模式自行推断决策后标记 resolved，全部 blocker 处理完毕后再提交"
          - "存在未解决 blocker 时无法以 passed 提交，先经 blocker_updates 逐条置 resolved（附用户答复）"
          - "提交 opx_agent_submit，必传参数 execution_boundary"
        constraints:
          - "工具调用边界：仅可调用 opx_status 与 opx_agent_submit"
          - "只审当前任务组范围：除任务排列合理性需阅览全部任务组标题外，其它检查聚焦当前任务组直接相关的文档章节"
          - "仅可 edit 修复 md 文档；设计/架构验证问题与信息缺口一律走 blocker"
  - name: in_progress
    steps:
      - id: implement
        agents:
          - id: openspec-developer
            capability_tags: [efficiency, api-testing]
        transitions:
          on_pass: verify_tool
          on_fail: analyze
        instructions:
          - "tasks.md 当前任务组任务项 + `[spec:xxx]` 溯源 specs/ 下相关 spec.md（需求细节与验收标准）；存在时读取 clarify.md（架构方向结论）"
          - "按 Task 项顺序逐个实现，聚焦当前子任务，不超出执行边界"
          - "环境/基础设施问题（schema 缺失、DDL 未执行、依赖未安装）应通过 migration/初始化脚本等代码层面解决；仅生产级凭据、真实第三方资源、人工运维才走 blocker/豁免"
          - "issue 指向文件的目录已并入执行边界，修复这些文件（含回归引入问题）不算越界；可按 issue 的 suggestion 直接执行修复；reviewer 的 boundary_expansion 已并入边界"
          - "按视图 Issue 清单分类实施：Low+ 必办，Info 建议修复不阻塞提交"
          - "对修复未过次数≥2 的 issue 须先完成 5-Why 根因分析再动手，不得跳过分析直接改代码"
          - "全部实现完成后先 git commit 再提交"
          - "提交前按已加载的质量门类 skill 完成本地构建验证并核对覆盖率门禁达标后再提交"
          - "提交前完成自检并经 self_check_results 汇总"
          - "修复完成的 issue 经 fixed_issue_ids 上报后进入待复核（review）状态，终态由对应 reviewer 复核裁定；不可修 issue 经 exempt_issue_ids 申请豁免；全部 blocking issue 均已上报修复或申请豁免后才可 passed 提交推进"
          - "遇外部依赖、凭证、真实输入或必须 stub/降级/跳过验收才能继续时，以 verdict=failed 提交 blocker（含 source_role、task_id、category、description、evidence、attempted_actions、options）"
          - "提交 opx_agent_submit：passed 必带 completed_task_ids；不可修 issue 申请豁免（exempt_issue_ids）"
        constraints:
          - "禁用 edit/write 修改 `{{worktree_path}}/openspec/changes/` 下任何文档（spec/design/tasks/clarify）"
          - "允许变更目录范围：{{allowed_directories}}"
          - "允许引用包范围：{{allowed_packages}}"
          - "实施前请注意遵守：{{notes}}"
          - "生产路径禁止 stub/fake/空实现/硬编码成功"
          - "暂停条件：需求模糊 / design 问题 / 技术阻塞 / 超出执行边界"
  - name: review
    steps:
      - id: verify_tool
        agents:
          - id: openspec-reviewer-tool
            capability_tags: [quality-gate, efficiency, api-testing]
        transitions:
          on_pass: verify_task
          on_fail: implement
        instructions:
          - "加载质量门类 skill 获取工具清单与映射规则，顺序运行全部确定性工具检查（代码格式/架构约束/静态分析/单元测试编译/深度扫描），将工具输出映射为统一 issue 结构并跨维提交"
          - "跨维报 issue 时在 new_children 的 dimension 字段自行指定归因维度（style/architecture/performance/security/maintainability）"
          - "工具检查覆盖全量代码；非本轮变更文件的工具违规同样映射为 issue 提交，禁止因非本轮引入静默丢弃"
          - "复核本层已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定」区块中的豁免申请经 exempt_adjudications 裁定（dismissed/rejected）"
          - "提交 opx_agent_submit，必带 verdict 参数（passed / failed）"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit、question（自愈失效时提请用户）；可 bash 运行工具但不得 edit/write 任何文件"
          - "即使无 issue 也必须提交 verdict=passed（不通过必须有至少一个 Low+ issue 作为理由）"
          - "Info 级 issue 的 description/suggestion 禁止阶段/时机表述（如'可后续处理'）"
      - id: verify_task
        agents:
          - id: openspec-reviewer-task
            capability_tags: [api-testing, quality-gate]
        transitions:
          on_pass: verify_quality
          on_fail: implement
        instructions:
          - "逐项验证：①task 产出完整性 ②启动服务并检查健康 ③独立执行 API 测试并审查质量 ④审查测试代码质量（断言放水/Mock 过度/覆盖不足）"
          - "design.md 的 API 定义（请求/响应结构、数据模型）与 specs/ 下相关 spec.md（用于准备测试数据、对照 API 合约）"
          - "有 task 未通过时必须 verdict=failed 并经 failed_tasks 上报（task_id + reason）；passed 时不允许提供 failed_tasks"
          - "复核本层已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定」区块中的豁免申请经 exempt_adjudications 裁定"
          - "按 opx_status 操作指引完成全部验证，提交前将各步骤执行结果填入 validation_steps 参数，不可跳过标注不可跳过的步骤"
          - "提交 opx_agent_submit，必带 verdict 与 verified_tasks（覆盖全部待验证 task）"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit；可 bash 启动服务/执行检查，但不得 edit/write 业务代码"
          - "即使无 issue / 无待验证 task 也必须提交 verdict=passed（不通过必须有至少一个 Low+ issue 作为理由）"
      - id: verify_quality
        agents:
          - id: openspec-reviewer-style
            capability_tags: [style, efficiency, tool-improvement]
          - id: openspec-reviewer-architecture
            capability_tags: [architecture, efficiency, tool-improvement]
          - id: openspec-reviewer-performance
            capability_tags: [performance, efficiency, tool-improvement]
          - id: openspec-reviewer-security
            capability_tags: [security, efficiency, tool-improvement]
          - id: openspec-reviewer-maintainability
            capability_tags: [maintainability, efficiency, tool-improvement]
        transitions:
          on_pass: done
          on_fail: implement
        instructions:
          - "加载匹配维度 skill，以本轮 diff/变更文件为锚点结合 skill 规范与领域知识做拓展审查（skill 仅为最低基准）；顺带发现的非本轮缺陷按本维度严重级别标准报 issue，禁止静默丢弃"
          - "审查新 issue 前先查看视图「本维度 Issue」区块中的既有 issue（含 tool review 阶段工具产生的本维度 issue），避免语义重复"
          - "报本维度新 issue 前先判断该问题能否通过调整确定性质量扫描工具配置（规则收紧/新增规则/配置增强）统一收敛：可工具化 → 双报业务 issue（file=违规现场）与工具改进 issue（file=规则/配置文件，suggestion 含规则草案+验证命令，末尾标 [tool_eligible]，且与业务 issue 同维度），两条 file 不同、方案不同，不构成语义重复，必须双报；工具改进 issue 目标文件在执行边界外时附 boundary_expansion（仅 verdict=failed 时可附）；不可工具化 → 仅报业务 issue。工具化判断细节与规则草案模板遵循已加载的工具改进类 skill，未加载工具改进类 skill 时仅报业务 issue、跳过工具改进环节；提交时在 validation_steps 中记录工具化判断结论"
          - "复核自己报的本维度已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "提交 opx_agent_submit，必带 verdict 与 validation_steps（验证步骤执行摘要）"
        constraints:
          - "禁止运行确定性工具检查（包括但不限于 linter/formatter/静态分析/编译/测试/架构约束检查等）；运行权归 tool review 层，本约束不排斥基于已加载 skill 做工具化可行性判断并提交工具改进 issue"
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit；不得 edit/write 任何文件，仅输出审查报告"
          - "即使无 issue 也必须提交 verdict=passed；passed=false 时必须有至少一个归属本维度的 Low+ issue 作为理由"
