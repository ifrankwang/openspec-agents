# task workflow：OpenSpec change 的通用任务流转
# 对应现有编排阶段：分析（todo）→ 实现（in_progress）→ 三重审查（review）
# 语义归属：step 级 instructions/constraints 定义各 step 专属语义；
# 跨所有 step 共享内容收敛到顶层 common（step 自动继承）；非 step 归属的引擎状态文案不进配置。
# 占位符 {{key}} 经 interpolateText 注入动态值，缺值保留原文。
id: task
name: Task Workflow
max_retries: 10

# 跨所有 step 共享的通用指引/约束：渲染时 common 在前、step 在后合并进对应视图区块
common:
  instructions:
    - "调用 opx_status 获取动态上下文（{{worktree_path}}、变更范围、上轮会话摘要）"
    - "按 Skill 加载清单加载匹配的 skill 并遵循其全部规范"
    - "读取 `{{worktree_path}}/openspec/changes/{{change_id}}/` 下的相关文档：tasks.md（任务清单，按行内 `[spec:xxx]` 溯源定位 specs/ 下相关 spec.md）、design.md、proposal.md"
    - "阅读 `{{worktree_path}}/AGENTS.md` 项目规范"
    - "需要外部框架/工具的权威文档（规则语义、API 用法、配置说明）时，优先通过文档检索渠道获取，禁止直接翻源码"
    - "完成后调用 opx_agent_submit 提交裁决或失败上报"
  constraints:
    - "所有 edit/write 操作限定在 {{worktree_path}} 内，严禁修改主仓库路径下的文件"
    - "禁止为获取外部框架/工具的规则语义、API 用法等知识而解析其源码、jar 包或执行 AST dump；此类知识一律通过文档检索渠道获取"
    - "不跳步骤、不自行推断阶段流转，next-step 以 opx_status 为准"
    - "禁止调用任何 opx_orch_* 工具（编排者专属）"
    - "以视图「变更范围」命令产出的文件清单作为本次工作范围"

phases:
  - name: todo
    steps:
      - id: analyze
        agents:
          - id: openspec-architect
            capability_tags: [architecture, api-design, db-design, efficiency]
        transitions:
          on_pass: implement
          on_fail: analyze
        instructions:
          - "校验 design.md 与 tasks.md、specs/ 下相关 spec.md 的一致性（据 tasks.md 各行 `[spec:xxx]` 溯源定位相关 spec.md 一并复核）"
          - "按评估维度逐项审查 design.md 并给出结论：architecture / api-design / db-design（无问题也需简要确认），不以假设替代确认"
          - "校验设计文档与任务前提的一致性，评估架构模式合规性"
          - "输出执行边界：allowed_directories（含测试目录）与 allowed_packages 白名单，notes 仅填实施建议（关键坑位/组件复用/边缘场景/框架应用/通用做法），不重复目录与包路径，无补充时留空"
          - "存在缺口时提交 blocker（category: architecture_design / info_gap），不以假设替代确认"
          - "需用户拍板的问题由你直接确认，不提交用户确认型 blocker：有人值守时用 question 工具向用户提问（拿到答复当场继续，不留档）；无人值守时（依据视图「确认模式」标识）自行选择最优解继续。确认/裁决后当场继续执行，本轮未干完下一轮重新确认"
          - "存在未解决 blocker 时无法以 passed 提交，先经 blocker_updates 逐条置 resolved（user_response 填确认/裁决结论）后再提交"
          - "提交 opx_agent_submit，必传参数 execution_boundary"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit、question（需用户拍板时使用）"
          - "只审当前任务组范围：除任务排列是否合理需阅览全部任务组标题外，其它检查聚焦当前任务组直接相关的文档章节"
          - "仅可 edit 修复 md 文档；设计/架构验证问题与信息缺口一律走 blocker"
  - name: in_progress
    steps:
      - id: implement
        agents:
          - id: openspec-developer
            capability_tags: [efficiency, api-testing, quality-gate, dev-practices]
        transitions:
          on_pass: verify_tool
          on_fail: analyze
        instructions:
          - "tasks.md 当前任务组任务项 + `[spec:xxx]` 溯源 specs/ 下相关 spec.md（需求细节与验收标准）；存在时读取 clarify.md（架构方向结论）"
          - "按 Task 项顺序逐个实现，聚焦当前子任务，不超出执行边界"
          - "实施前识别 spec 描述的一并操作行为组（如状态变更与数据入队这类需同时发生的多个行为）；实施后逐项自证每个行为真实生效，禁止以单一状态字段的实现替代其他行为"
          - "环境/基础设施问题（schema 缺失、DDL 未执行、依赖未安装）应通过 migration/初始化脚本等代码层面解决；仅生产级凭据、真实第三方资源、人工运维才走 blocker/豁免"
          - "issue 指向文件的目录已并入执行边界，修复这些文件（含回归引入问题）不算越界；issue 的 file 字段指向 openspec/changes/ 下文档时，按该 issue 要求修复对应文档同样不算越界（仅限该 issue 指定文件，不得扩大范围）；可按 issue 的 suggestion 直接执行修复；reviewer 的 boundary_expansion 已并入边界"
          - "按视图 Issue 清单分类实施：Low+ 必办，Info 建议修复不阻塞提交"
          - "对修复未过次数≥2 的 issue 须先完成 5-Why 根因分析再动手，不得跳过分析直接改代码"
          - "全部实现完成后先 git commit 再提交"
          - "提交前按已加载的质量门类 skill 完成本地构建验证并核对覆盖率门禁达标后再提交"
          - "提交前完成自检并经 self_check_results 汇总"
          - "修复完成的 issue 经 fixed_issue_ids 上报后进入待复核（review）状态，终态由对应 reviewer 复核裁定；不可修 issue 经 exempt_issue_ids 申请豁免（申请后进入待裁定（review）状态，由报源 reviewer 在后续审查轮次裁定，被驳回的 issue 回待修复）；Info 级 issue 不阻塞提交，无需申请豁免；全部 blocking issue 均已上报修复或申请豁免后才可 passed 提交推进"
          - "遇外部依赖、凭证、真实输入或必须 stub/降级/跳过验收才能继续时，以 verdict=failed 提交 blocker（含 source_role、task_id、category、description、evidence、attempted_actions、options）"
          - "提交 opx_agent_submit：passed 时存在未完成或被驳回（open/rejected）的子任务必须全部列入 completed_task_ids（数字 id 如 1、2，或任务编号如 1.1），全部子任务已验证时可省略；不可修 issue 申请豁免（exempt_issue_ids）"
        constraints:
          - "禁用 edit/write 修改 `{{worktree_path}}/openspec/changes/` 下任何文档（spec/design/tasks/clarify）；唯一例外：所提交 fixed_issue_ids 中某 issue 的 file 字段指向该目录下文档时，仅允许按该 issue 的要求修改对应文档，不得扩大范围；本约束为提示词级约束，工具层不校验实际改动的文件"
          - "允许变更目录范围：{{allowed_directories}}"
          - "允许引用包范围：{{allowed_packages}}"
          - "实施前请注意遵守：{{notes}}"
          - "生产路径禁止 stub/fake/空实现/硬编码成功"
          - "需以 verdict=failed + blocker 上报的条件：需求模糊 / design 问题 / 技术阻塞 / 超出执行边界"
  - name: review
    steps:
      - id: verify_tool
        agents:
          - id: openspec-reviewer-tool
            capability_tags: [quality-gate, efficiency, api-testing]
        transitions:
          on_pass: verify_task
          on_fail: implement
        instructions:
          - "依据 opx_status 提供的变更检测结果分流：无代码/配置变更且本层无待复核/待裁定项 → 直接提交 passed，不运行全量工具检查；无变更但有本层待复核/待裁定项 → 仅复核/裁定待处理项后提交，不跑全量工具扫描；有变更 → 加载质量门类 skill 获取工具清单与映射规则，顺序运行全部确定性工具检查（代码格式/架构约束/静态分析/单元测试编译/深度扫描），将工具输出映射为统一 issue 结构后提交"
          - "「有变更」分支先审查上方「本次变更证据」区块的变更文件清单与区间 diff 内容后自行判断：若确认本次变更仅为注释/文档性且无逻辑影响（非注释掉代码、非结构性/格式化变更、非文件重命名），可自行决定跳过全量工具检查直接提交 passed；无法确认或含逻辑/结构变更，必须顺序运行全部确定性工具检查；裁量仅免除全量工具扫描，不免除复核/裁定——本层 blocking issue 仍须处理至终态后提交"
          - "报 issue 时必须显式声明归因维度 dimension（style/architecture/performance/security/maintainability）：本 reviewer 不归属任一质量维度，dimension 即该 issue 归属的目标质量维度"
          - "无变更直提分支不执行全量工具扫描，该分支下存量工具违规不重复扫描；实质代码/配置变更必须按全量覆盖：工具检查覆盖全量代码，非本轮变更文件的工具违规同样映射为 issue 提交，禁止因非本轮引入静默丢弃；仅注释/文档性变更（经审查确认）可免全量工具检查；命中项目级豁免清单（视图标注）的存量问题按 Info 提报，不重新豁免，其余非本轮引入问题仍按原严重级别上报"
          - "当发现修复需要调整 openspec/changes/ 下文档时，所报 issue 的 file 字段必须指向目标文档"
          - "复核本层已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定（dismissed/rejected）"
          - "提交 opx_agent_submit，必带 verdict 参数（passed / failed）"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit、question（需要用户协助处理时）；可 bash 运行工具但不得 edit/write 任何文件"
          - "即使无 issue 也必须提交 verdict=passed（不通过必须有至少一个 Low+ issue 作为理由）"
          - "Info 级 issue 的 description/suggestion 禁止阶段/时机表述（如'可后续处理'）"
      - id: verify_task
        agents:
          - id: openspec-reviewer-task
            capability_tags: [api-testing, efficiency, dev-practices]
        transitions:
          on_pass: verify_quality
          on_fail: implement
        instructions:
          - "逐项验证：①task 产出完整性 ②启动服务并检查健康 ③独立执行全量 API 测试并审查质量 ④审查测试代码质量（断言放水/Mock 过度/覆盖不足）⑤业务行为真实性：对照 spec 逐项核验每个业务行为的实现与断言证据（含一并操作的行为组、连带效果、下游消费），识别『仅打状态标记未实际生效』类缺陷"
          - "本次变更仅含测试代码（判定：视图「变更范围」文件清单全部命中已加载技术栈 skill 定义的测试代码路径，且无生产代码、接口契约、构建与测试配置等非测试文件）时，豁免②启动服务并检查健康与③独立执行全量 API 测试，仅验证①④；豁免时 validation_steps 中②③置 completed=false，并在 skip_reason 注明「本次变更仅含测试代码，豁免启动服务与 API 测试」及判定依据；⑤的实现核验在纯测试代码变更场景无对象，其断言证据核验并入④测试代码质量"
          - "读取 design.md 的 API 定义（请求/响应结构、数据模型）与 specs/ 下相关 spec.md（需求细节与验收标准），用于准备测试数据与对照 API 合约"
          - "有 task 未通过时必须 verdict=failed 并经 failed_tasks 上报（task_id + reason）；passed 时不允许提供 failed_tasks"
          - "当发现修复需要调整 openspec/changes/ 下文档时，所报 issue 的 file 字段必须指向目标文档"
          - "报 issue 时必须显式声明归因维度 dimension（style/architecture/performance/security/maintainability）：本 reviewer 不归属任一质量维度，dimension 即该 issue 归属的目标质量维度"
          - "复核本层已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定"
          - "按 opx_status 操作指引完成全部验证项，提交前将每项验证结果与证据填入 validation_steps 参数（未执行的项须填 skip_reason 注明原因），不得省略任何一项"
          - "提交 opx_agent_submit，必带 verdict 与 verified_tasks（覆盖全部待验证 task）"
        constraints:
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit；可 bash 启动服务/执行检查，但不得 edit/write 业务代码"
          - "即使无 issue / 无待验证 task 也必须提交 verdict=passed（不通过必须有至少一个 Low+ issue 作为理由）"
      - id: verify_quality
        agents:
          - id: openspec-reviewer-style
            capability_tags: [style, efficiency, tool-improvement]
          - id: openspec-reviewer-architecture
            capability_tags: [architecture, efficiency, tool-improvement]
          - id: openspec-reviewer-performance
            capability_tags: [performance, efficiency, tool-improvement]
          - id: openspec-reviewer-security
            capability_tags: [security, efficiency, tool-improvement]
          - id: openspec-reviewer-maintainability
            capability_tags: [maintainability, efficiency, tool-improvement]
        transitions:
          on_pass: done
          on_fail: implement
        instructions:
          - "加载匹配维度 skill，以本轮 diff/变更文件为锚点结合 skill 规范与领域知识做拓展审查（skill 仅为最低基准）；顺带发现的非本轮缺陷按本维度严重级别标准报 issue，禁止静默丢弃"
          - "审查新 issue 前先查看视图「待复核」区块中的既有 issue（仅本维度报源），避免语义重复"
          - "当发现修复需要调整 openspec/changes/ 下文档时，所报 issue 的 file 字段必须指向目标文档"
          - "报本维度新 issue 前先判断该问题能否通过调整确定性质量扫描工具配置（规则收紧/新增规则/配置增强）统一收敛：可工具化 → 双报业务 issue（file=违规现场）与工具改进 issue（file=规则/配置文件，suggestion 含规则草案+验证命令，末尾标 [tool_eligible]，且与业务 issue 同维度），两条 file 不同、方案不同，不构成语义重复，必须双报；工具改进 issue 目标文件在执行边界外时附 boundary_expansion（仅 verdict=failed 时可附）；不可工具化 → 仅报业务 issue。工具化判断细节与规则草案模板遵循已加载的工具改进类 skill，未加载工具改进类 skill 时仅报业务 issue、跳过工具改进环节；提交时在 validation_steps 中记录工具化判断结论"
          - "复核自己报的本维度已修复待复核（review 态）issue：通过置 done，不通过驳回（附驳回原因，issue 回待修复并累计修复未过次数）"
          - "对视图「待裁定是否可豁免」区块中的豁免申请经 exempt_adjudications 裁定（dismissed/rejected）"
          - "提交 opx_agent_submit，必带 verdict 与 validation_steps（验证步骤执行摘要）"
        constraints:
          - "禁止运行确定性工具检查（包括但不限于 linter/formatter/静态分析/编译/测试/架构约束检查等）；运行权归 tool review 层，本约束不排斥基于已加载 skill 做工具化可行性判断并提交工具改进 issue"
          - "工具调用边界：仅可调用 opx_status、opx_agent_submit；不得 edit/write 任何文件，仅输出审查报告"
          - "即使无 issue 也必须提交 verdict=passed；passed=false 时必须有至少一个归属本维度的 Low+ issue 作为理由"
