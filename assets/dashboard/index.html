<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编排进度看板 · 5 列看板</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#f8fafc;--surface:#fff;--surface-2:#f1f5f9;
  --ink:#0f172a;--muted:#475569;--quiet:#94a3b8;
  --line:#e2e8f0;--line-2:#cbd5e1;
  --blue:#2563eb;--blue-soft:#eff6ff;
  --green:#16a34a;--green-soft:#f0fdf4;
  --amber:#d97706;--amber-soft:#fffbeb;
  --red:#dc2626;--red-soft:#fef2f2;
  --violet:#7c3aed;--violet-soft:#f5f3ff;
  --teal:#0d9488;--teal-soft:#f0fdfa;
  --radius:12px;--radius-sm:8px;--pill:999px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.04);
  --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}html{font-size:15px}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{max-width:1440px;margin:0 auto;padding:32px 28px 80px}
/* header */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:8px}
.badge{display:inline-flex;align-items:center;gap:8px;font:600 .68rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.03em}
.meta{display:flex;gap:28px;text-align:right;font-size:.8rem;color:var(--muted)}
.meta span{display:flex;flex-direction:column;gap:5px}.meta strong{color:var(--ink);font-weight:600}
/* 5 列看板 */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:start;padding-top:24px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.col-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.col-head h3{margin:0;font-size:.92rem;font-weight:700}
.col-count{font:600 .78rem/1 var(--mono);padding:4px 10px;background:var(--surface-2);border-radius:var(--pill);color:var(--muted)}
.col-body{max-height:calc(100vh - 280px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.board-empty{grid-column:1/-1;padding:48px 0;text-align:center;color:var(--quiet);font-size:.9rem}
/* 卡片 */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius-sm);box-shadow:0 1px 2px rgba(15,23,42,.04);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.task{border-left-color:var(--blue)}
.card.issue{border-left-color:var(--violet)}
.card.suspended{border-style:dashed;opacity:.94}
.card-head{display:flex;align-items:center;gap:8px}
.type-tag{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font:700 .7rem/1 var(--mono);color:#fff}
.type-tag.task{background:var(--blue)}.type-tag.issue{background:var(--violet)}
.src-icon{flex:0 0 auto;font-size:.85rem;color:var(--quiet);line-height:1}
.card-title{margin:0;font-size:.9rem;font-weight:700;line-height:1.4;flex:1}
.card-desc{font-size:.78rem;color:var(--muted);line-height:1.5}
.card-desc.collapsed{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc-toggle{margin-top:-4px;font-size:.72rem;color:var(--blue);background:none;border:none;padding:0;cursor:pointer;text-align:left}
.card-labels{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--pill);font:500 .68rem/1.4 var(--mono);background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.card-children{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.child-row{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted)}
.child-type{flex:0 0 auto;width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font:700 .58rem/1 var(--mono);color:#fff}
.child-type.task{background:var(--blue)}.child-type.issue{background:var(--violet)}
.child-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.card-verdicts{display:flex;flex-wrap:wrap;gap:6px}
.verdict{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:var(--pill);font:600 .68rem/1.4 var(--mono);background:var(--surface-2);color:var(--muted)}
.verdict.passed{background:var(--green-soft);color:var(--green)}
.verdict.failed{background:var(--red-soft);color:var(--red)}
.verdict.pending{background:var(--surface-2);color:var(--quiet)}
.card-meta{display:flex;align-items:center;gap:6px;flex-shrink:0}
.step-tag{font:.68rem/1.4 var(--mono);color:var(--quiet)}
.suspend-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--pill);font:600 .7rem/1.4 var(--mono);background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);cursor:pointer}
.suspend-reason{margin-top:4px;font-size:.72rem;color:var(--amber);background:var(--amber-soft);border-radius:var(--radius-sm);padding:6px 8px}
/* severity 色条 */
.sev-bar{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.sev-bar.critical{background:var(--red)}.sev-bar.high{background:var(--amber)}.sev-bar.medium{background:var(--violet)}.sev-bar.low{background:var(--teal)}.sev-bar.info{background:var(--line-2)}
@media(max-width:1024px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.board{grid-template-columns:1fr}.topbar{flex-direction:column;gap:14px}.meta{text-align:left}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="badge" id="connBadge"><span>实时同步</span></div>
      <h1>编排进度看板</h1>
    </div>
    <div class="meta">
      <span>变更编号<strong id="changeId">-</strong></span>
      <span>基准分支<strong id="baseBranch">-</strong></span>
      <span>最后更新<strong id="updatedAt">-</strong></span>
    </div>
  </header>
  <main id="dashboard"></main>
</div>
<script>
const COLUMNS=[['todo','待办'],['in_progress','处理中'],['review','审核中'],['done','完成'],['cancelled','已取消']];
const SOURCE_ICONS={openspec:'◈',ado:'◆',custom:'✚'};
const VERDICT_ICONS={passed:'✓',failed:'✕',pending:'○'};
const AGENT_SHORT={'openspec-architect':'architect','openspec-developer':'dev','openspec-reviewer-tool':'tool','openspec-reviewer-task':'task','openspec-reviewer-style':'style','openspec-reviewer-architecture':'arch','openspec-reviewer-performance':'perf','openspec-reviewer-security':'sec','openspec-reviewer-maintainability':'maint'};
let dashboardState={};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]))}
function cls(v){return String(v??'').replace(/[^a-zA-Z0-9_-]/g,'_')}
function shortAgent(key){if(AGENT_SHORT[key])return AGENT_SHORT[key];const m=/^openspec-reviewer-(.+)$/.exec(key)||/^openspec-(.+)$/.exec(key);return m?m[1]:(key||'')}
function descBlock(text){if(!text)return '';if(text.length<90)return `<div class="card-desc">${esc(text)}</div>`;return `<div class="card-desc collapsed">${esc(text)}</div><button class="desc-toggle">展开</button>`}
function verdictDot(v){return `<span class="verdict ${cls(v.verdict)}" title="${esc(v.stepId)}">${esc(shortAgent(v.agentKey))}:${VERDICT_ICONS[v.verdict]||'○'}</span>`}
function renderCard(c){
  const isIssue=c.type==='issue';
  const typeTag=`<span class="type-tag ${isIssue?'issue':'task'}">${isIssue?'I':'T'}</span>`;
  const srcIcon=`<span class="src-icon" title="${esc(c.source||'')}">${SOURCE_ICONS[c.source]||'●'}</span>`;
  const sevBar=isIssue&&c.severity?`<span class="sev-bar ${cls(String(c.severity).toLowerCase())}" title="${esc(c.severity)}"></span>`:'';
  const labels=(c.labels||[]).map(l=>`<span class="chip">${esc(l)}</span>`).join('');
  const step=c.currentStep?`<span class="step-tag">${esc(c.currentStep)}</span>`:'';
  const suspTag=c.suspended?'<span class="suspend-tag" role="button" tabindex="0">⏸ 暂停</span>':'';
  const suspReason=c.suspended?`<div class="suspend-reason" hidden>${esc(c.suspendReason||'未提供暂停原因')}</div>`:'';
  const verdicts=(c.agentVerdicts||[]).map(verdictDot).join('');
  const children=(c.children||[]).map(ch=>`<div class="child-row"><span class="child-type ${cls(ch.type)}">${ch.type==='issue'?'I':'T'}</span><span class="child-title">${esc(ch.title)}</span></div>`).join('');
  return `<article class="card ${isIssue?'issue':'task'}${c.suspended?' suspended':''}" data-id="${esc(c.id)}">${sevBar}
    <div class="card-head">${typeTag}${srcIcon}<h4 class="card-title">${esc(c.title)}</h4></div>
    ${descBlock(c.description)}
    ${labels?`<div class="card-labels">${labels}</div>`:''}
    ${children?`<div class="card-children">${children}</div>`:''}
    <div class="card-foot">${verdicts?`<div class="card-verdicts">${verdicts}</div>`:'<span></span>'}<div class="card-meta">${step}${suspTag}</div></div>
    ${suspReason}
  </article>`;
}
function renderBoard(){
  const cards=dashboardState.workItemCards||[];
  if(!cards.length)return `<section class="board"><div class="board-empty">暂无工作项数据（旧格式状态或未初始化）</div></section>`;
  return `<section class="board">${COLUMNS.map(([key,label])=>{
    const items=cards.filter(c=>c.phase===key);
    return `<div class="col" data-col="${key}"><header class="col-head"><h3>${label}</h3><span class="col-count">${items.length}</span></header><div class="col-body">${items.map(renderCard).join('')}</div></div>`;
  }).join('')}</section>`;
}
function render(){
  document.getElementById('changeId').textContent=dashboardState.changeId||'-';
  document.getElementById('baseBranch').textContent=dashboardState.baseBranch||'-';
  document.getElementById('updatedAt').textContent=dashboardState.updatedAt?new Date(dashboardState.updatedAt).toLocaleString():'-';
  document.getElementById('dashboard').innerHTML=renderBoard();
  document.querySelectorAll('.desc-toggle').forEach(btn=>btn.addEventListener('click',e=>{
    const d=e.target.previousElementSibling;
    if(d&&d.classList.contains('card-desc')){d.classList.toggle('collapsed');e.target.textContent=d.classList.contains('collapsed')?'展开':'收起'}
  }));
  document.querySelectorAll('.suspend-tag').forEach(tag=>tag.addEventListener('click',e=>{
    const card=e.target.closest('.card');
    const reason=card&&card.querySelector('.suspend-reason');
    if(reason)reason.hidden=!reason.hidden;
  }));
}
async function loadState(){try{const res=await fetch('/api/state');if(!res.ok)throw new Error('fetch failed');const data=await res.json();if(data&&data.active===true){dashboardState=data;render()}}catch(e){console.error('[dashboard] load state failed',e)}}
render();
loadState();
</script>
</body>
</html>
