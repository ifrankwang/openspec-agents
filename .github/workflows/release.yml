name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.118.0)'
        required: true
        default: '0.118.0'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build plugin packages
        run: bun run build:plugins

      - name: Check npm version existence
        id: check-npm
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          if npm view "@ifrankwang/openspec-agents@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.check-npm.outputs.exists == 'false'
        run: npm publish --provenance --access public

      - name: Setup SSH agent for marketplace repos
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.CODEX_MARKETPLACE_DEPLOY_KEY }}
            ${{ secrets.CLAUDE_MARKETPLACE_DEPLOY_KEY }}
            ${{ secrets.ZCODE_MARKETPLACE_DEPLOY_KEY }}

      - name: Publish marketplace repos
        run: node .github/scripts/publish-marketplaces.mjs
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
